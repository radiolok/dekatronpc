<title>Структурные схемы DekatronPC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Sans:ital,wght@0,400;0,700;1,400&family=PT+Sans+Narrow:wght@400;700&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
/* Лист чертежа: светлое поле плёнки, чернила, один тёплый акцент — цвет тлеющего разряда.
   Акцентом отмечено только то, о чём лист: путь разряда, цепочка переноса, ленивое чтение. */
:root {
  --paper: #eef1f0;
  --sheet: #fbfcfb;
  --ink: #172024;
  --muted: #56636a;
  --rule: #c6cfcd;
  --panel: #ffffff;
  --hatch: #e3e9e8;
  --glow: #c8431a;
  --glow-soft: rgba(200, 67, 26, 0.13);
  --warn: #a4126e;
  --display: "PT Sans Narrow", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "PT Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d1113; --sheet: #131a1d; --ink: #dce5e7; --muted: #8e9ca2; --rule: #2b3539;
    --panel: #172024; --hatch: #1e292d; --glow: #ff8a4f; --glow-soft: rgba(255, 138, 79, 0.17);
    --warn: #f36cc0; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d1113; --sheet: #131a1d; --ink: #dce5e7; --muted: #8e9ca2; --rule: #2b3539;
  --panel: #172024; --hatch: #1e292d; --glow: #ff8a4f; --glow-soft: rgba(255, 138, 79, 0.17);
  --warn: #f36cc0; color-scheme: dark;
}

body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 1200px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 64px; }

header.doc { display: grid; gap: 6px; margin-bottom: 18px; }
.eyebrow { font-family: var(--display); text-transform: uppercase; letter-spacing: 0.12em; font-size: 13px; color: var(--muted); }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(30px, 4.4vw, 46px); line-height: 1.05; margin: 0; text-wrap: balance; letter-spacing: 0.01em; }
.lead { max-width: 68ch; color: var(--muted); margin: 4px 0 0; }

nav.toc { display: flex; flex-wrap: wrap; gap: 6px 8px; margin: 18px 0 28px; padding: 0; list-style: none; }
nav.toc a { display: inline-flex; gap: 8px; align-items: baseline; padding: 5px 10px; border: 1px solid var(--rule); border-radius: 3px; color: var(--ink); text-decoration: none; font-family: var(--display); font-size: 15px; background: var(--sheet); }
nav.toc a span { font-family: var(--mono); font-size: 11px; color: var(--muted); }
nav.toc a:hover, nav.toc a:focus-visible { border-color: var(--glow); outline: none; }

section.sheet { background: var(--sheet); border: 1px solid var(--rule); margin-bottom: 34px; display: grid; }
.sheet-body { padding: 22px 24px 8px; display: grid; gap: 18px; min-width: 0; }
.sheet h2 { font-family: var(--display); font-weight: 700; font-size: 28px; margin: 0; line-height: 1.1; text-wrap: balance; }
.sheet h3 { font-family: var(--display); font-weight: 700; font-size: 19px; margin: 6px 0 0; letter-spacing: 0.01em; }
.sheet p { margin: 0; max-width: 72ch; }
.sheet .num { font-family: var(--mono); font-size: 12px; color: var(--glow); letter-spacing: 0.06em; }

figure { margin: 0; display: grid; gap: 8px; min-width: 0; }
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px; }
figcaption { font-size: 13.5px; color: var(--muted); max-width: 80ch; }
figcaption b { color: var(--ink); font-weight: 700; }

.pair { display: grid; grid-template-columns: minmax(0, 560px) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 900px) { .pair { grid-template-columns: minmax(0, 1fr); } }

table.spec { border-collapse: collapse; font-size: 13.5px; width: 100%; }
table.spec th, table.spec td { border-bottom: 1px solid var(--rule); padding: 6px 10px 6px 0; text-align: left; vertical-align: top; }
table.spec th { font-family: var(--display); font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
table.spec code, .sheet p code, figcaption code, li code { font-family: var(--mono); font-size: 0.86em; background: var(--hatch); padding: 0 4px; border-radius: 2px; }
.tbl { overflow-x: auto; min-width: 0; }
td.acc { color: var(--glow); font-weight: 700; }

.note { border-left: 3px solid var(--glow); padding: 8px 14px; background: var(--glow-soft); max-width: 80ch; font-size: 14px; }
.note b { font-family: var(--display); letter-spacing: 0.02em; }

/* основная надпись листа */
.stamp { display: grid; grid-template-columns: 120px 1fr 1fr 70px 70px; border-top: 1.5px solid var(--ink); font-size: 12px; }
.stamp div { padding: 6px 10px; border-right: 1px solid var(--rule); min-width: 0; }
.stamp div:last-child { border-right: 0; }
.stamp .k { display: block; font-family: var(--display); text-transform: uppercase; letter-spacing: 0.08em; font-size: 10.5px; color: var(--muted); }
.stamp .v { font-family: var(--mono); font-size: 11.5px; overflow-wrap: anywhere; }
@media (max-width: 720px) { .stamp { grid-template-columns: 1fr 1fr; } .stamp div { border-bottom: 1px solid var(--rule); } }

/* схемы */
.dg { display: block; height: auto; color: var(--ink); }
.dg text { fill: currentColor; font-family: var(--body); font-size: 11px; }
.dg .tt { font-family: var(--display); font-weight: 700; font-size: 14px; letter-spacing: 0.02em; }
.dg .tm { font-family: var(--mono); font-size: 10.5px; }
.dg .tl { fill: var(--muted); font-size: 11.5px; }
.dg .tp { font-family: var(--mono); font-size: 11px; }
.dg .tpi { font-family: var(--mono); font-size: 10px; fill: var(--muted); }
.dg .tn { fill: var(--muted); font-size: 10.5px; }
.dg .tg { font-family: var(--mono); font-size: 13px; font-weight: 700; }
.dg .ts { font-family: var(--mono); font-size: 11.5px; font-weight: 600; }
.dg .tf { font-family: var(--display); font-size: 13px; letter-spacing: 0.03em; fill: var(--muted); }
.dg .tk { font-family: var(--display); font-weight: 700; font-size: 14px; }
.dg .ti { font-family: var(--mono); font-size: 8.5px; fill: var(--muted); }
.dg .tnum { font-family: var(--mono); font-size: 11px; font-weight: 700; fill: var(--glow); }
.dg .tacc { fill: var(--glow); font-weight: 700; font-size: 11.5px; }
.dg .blk { fill: var(--panel); stroke: currentColor; stroke-width: 1.2; }
.dg .blk-opt { fill: var(--panel); stroke: currentColor; stroke-width: 1.2; stroke-dasharray: 6 3; }
.dg .blk-acc { fill: var(--glow-soft); stroke: var(--glow); stroke-width: 1.6; }
.dg .frame { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 4; }
.dg .w { fill: none; stroke: currentColor; stroke-width: 1.2; }
.dg .wd { fill: none; stroke: currentColor; stroke-width: 1.2; stroke-dasharray: 5 3; }
.dg .wacc { fill: none; stroke: var(--glow); stroke-width: 1.9; }
.dg .wbus { fill: none; stroke: currentColor; stroke-width: 3.2; }
.dg .wthin { fill: none; stroke: var(--muted); stroke-width: 1; }
.dg .wv { fill: none; stroke: currentColor; stroke-width: 1.6; }
.dg .wvacc { fill: none; stroke: var(--glow); stroke-width: 2.1; }
.dg .grid { stroke: var(--rule); stroke-width: 1; }
.dg .ah { fill: currentColor; }
.dg .ahg { fill: var(--glow); }
.dg .ahw { fill: var(--warn); }
.dg .wwarn { fill: none; stroke: var(--warn); stroke-width: 1.8; stroke-dasharray: 6 3; }
.dg .twarn { fill: var(--warn); font-weight: 700; font-size: 11.5px; }
.dg .tl, .dg .tn, .dg .tacc, .dg .twarn { paint-order: stroke; stroke: var(--sheet); stroke-width: 4px; stroke-linejoin: round; }
.dg .dot { fill: currentColor; }
.dg .dot-acc { fill: var(--glow); }
.dg .inv { fill: var(--panel); stroke: currentColor; stroke-width: 1.2; }
.dg .st { fill: var(--panel); stroke: currentColor; stroke-width: 1.3; }
.dg .st-acc { fill: var(--glow-soft); stroke: var(--glow); stroke-width: 1.9; }
.dg .st-dim { fill: var(--hatch); stroke: var(--muted); stroke-width: 1.1; stroke-dasharray: 4 3; }
.dg .anode { fill: var(--hatch); stroke: var(--muted); stroke-width: 1; }
.dg .kmain { fill: var(--panel); stroke: currentColor; stroke-width: 1.4; }
.dg .kga { fill: var(--panel); stroke: currentColor; stroke-width: 1.2; }
.dg .kgb { fill: var(--muted); }
.dg .lit { fill: var(--glow); stroke: var(--glow); }
.dg .halo { fill: var(--glow-soft); }
.dg .tgt { fill: none; stroke: var(--glow); stroke-width: 1.3; stroke-dasharray: 3 3; }
.dg .seg { fill: var(--panel); stroke: currentColor; stroke-width: 1.1; }
.dg .seg-acc { fill: var(--glow-soft); stroke: var(--glow); stroke-width: 1.4; }
.dg .seg-off { fill: var(--hatch); stroke: var(--muted); stroke-width: 1; }

a { color: var(--glow); }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>
