<text x="20" y="743" font-size="10.5" fill="#5d6670">Master M: S = D, R = ~D, E = C. Slave S: S = QM, R = QNM, E = ~C. Two Inverters (Л901a: D, Л901b: C; Ra 10k + 680 µH ‖ 10k each); each inverter plate reaches its latch through a Divider (470k ‖ C / 200k to −50 V).</text>
<text x="20" y="757" font-size="10.5" fill="#5d6670">Master outputs reach the slave through their own 2.7 pF Dividers; the slave enable Divider has 13.6 pF (the clock edge is delayed against D).</text>
<text x="20" y="771" font-size="10.5" fill="#5d6670">SN is the reset line (idle −20 V, GND = set): one diode of Л902 to FQ of each latch pulls the triode on plate QN on, so Q goes high. Cc 2.7 pF (Q → FQ) compensates the diode capacitance.</text>
<text x="20" y="785" font-size="10.5" fill="#5d6670">The RS latches, Inverters and Dividers are drawn as elements: the latch circuit is on the RSLATCH_J2N16 page.</text>
<text x="20" y="799" font-size="10.5" fill="#5d6670">LV (grids): 1 = +10 V, 0 = −20 V.   HV (plates): 1 = +150 V, 0 = +50 V.</text>
<text x="20" y="813" font-size="10.5" fill="#5d6670">Heater 6.3 V on H1/H2 of every tube, all in parallel, not drawn.</text>
</svg>
