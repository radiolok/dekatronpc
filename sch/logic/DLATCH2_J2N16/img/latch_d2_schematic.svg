<text x="20" y="648" font-size="10.5" fill="#5d6670">Latch k is transparent while E is high: Qk = Dk, QNk = ~Dk. R of each latch is ~D from an Inverter (half a 6N16B, Ra 10k + 680 µH ‖ 10k) through a Divider (470k ‖ 2.7 pF / 200k).</text>
<text x="20" y="662" font-size="10.5" fill="#5d6670">Inverters, dividers and the RS latches are drawn as elements: the latch circuit is on the RSLATCH_J2N16 page. Л901a, Л901b are the two triodes of one bulb.</text>
<text x="20" y="676" font-size="10.5" fill="#5d6670">LV (grids): 1 = +10 V, 0 = −20 V.   HV (plates): 1 = +150 V, 0 = +50 V.</text>
<text x="20" y="690" font-size="10.5" fill="#5d6670">Heater 6.3 V on H1/H2 of every tube, all in parallel, not drawn.</text>
