<text x="20" y="398" font-size="10.5" fill="#5d6670">Y1 = triodes Л101a, Л101b, Л102a;  Y2 = Л102b, Л103a, Л103b: 1.5 tubes per cell.</text>
<text x="20" y="412" font-size="10.5" fill="#5d6670">Plate load: Ra 10k in series with L 680 µH ‖ Rd 10k (TRS v0.58): the choke speeds up the rising edge of Y.</text>
