<text x="20" y="718" font-size="10.5" fill="#5d6670">D and C are HV pins. D reaches S through a slow Divider 150k / 62k with no speed-up capacitor (delay ≈ 150 ns): the bistable needs 100…230 ns to flip, so the new D must not race through the open gate.</text>
<text x="20" y="732" font-size="10.5" fill="#5d6670">Each flip-flop has its own Inverter, half of Л901 (a for FF1, b for FF2), Ra 10k without a choke: it is part of the D delay (a choke costs 30 ns of hold). The core is drawn in full on the DFFP_J2N16 core figure. At most two D pins per net (1.2 mA DC each).</text>
<text x="20" y="746" font-size="10.5" fill="#5d6670">LV (grids): 1 = +10 V, 0 = −20 V.   HV (plates): 1 = +150 V, 0 = +50 V.</text>
<text x="20" y="760" font-size="10.5" fill="#5d6670">Heater 6.3 V on H1/H2 of every tube, all in parallel, not drawn.</text>
</svg>
