<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='700' viewBox='0 0 1200 700'>
<title>Плата декатрона: структурная схема</title>
<rect x='0' y='0' width='1200' height='700' fill='white'/>
<text x='20.0' y='26.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='15' text-anchor='start' fill='#111' font-weight='bold'>Рис. 0. Плата декатрона и соседние платы (одна плата — один декатрон)</text>
<rect x='20.0' y='50.0' width='700' height='560' fill='none' stroke='#555' stroke-width='1.2' stroke-dasharray='6,4'/>
<text x='30.0' y='70.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' text-anchor='start' fill='#555' font-weight='bold'>Плата декатрона: А110 (2 места) + обвязка ≤ 14 мест</text>
<rect x='50.0' y='90.0' width='200' height='110' fill='#fafafa' stroke='#111' stroke-width='1.5'/>
<text x='150.0' y='110.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' text-anchor='middle' fill='#111' font-weight='bold'>А110 + Rа</text>
<text x='150.0' y='130.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' text-anchor='middle' fill='#111'>декатрон, 13 выводов</text>
<text x='150.0' y='147.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' text-anchor='middle' fill='#111'>Rа 200k на плате</text>
<text x='150.0' y='164.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' text-anchor='middle' fill='#111'>(REQ-PR-020)</text>
<rect x='50.0' y='240.0' width='200' height='120' fill='#fafafa' stroke='#111' stroke-width='1.5'/>
<text x='150.0' y='260.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' text-anchor='middle' fill='#111' font-weight='bold'>Rк × 10</text>
<text x='150.0' y='280.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' text-anchor='middle' fill='#111'>33k на катод</text>
<text x='150.0' y='297.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' text-anchor='middle' fill='#111'>перемычки: запись /</text>
<text x='150.0' y='314.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' text-anchor='middle' fill='#111'>сброс 0 / сброс 0–9</text>
<text x='150.0' y='331.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' text-anchor='middle' fill='#111'>(общая шина Bобщ)</text>
<rect x='290.0' y='90.0' width='200' height='110' fill='#fafafa' stroke='#111' stroke-width='1.5'/>
<text x='390.0' y='110.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' text-anchor='middle' fill='#111' font-weight='bold'>Цепи подкатодов</text>
<text x='390.0' y='130.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' text-anchor='middle' fill='#111'>Cп 220 пФ × 2</text>
<text x='390.0' y='147.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' text-anchor='middle' fill='#111'>Rсм 100k × 2 → Uсм</text>
<text x='390.0' y='164.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' text-anchor='middle' fill='#111'>[½ 6Х7Б × 2, если нужен]</text>
<rect x='290.0' y='240.0' width='200' height='120' fill='#fafafa' stroke='#111' stroke-width='1.5'/>
<text x='390.0' y='260.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' text-anchor='middle' fill='#111' font-weight='bold'>Диоды чтения</text>
<text x='390.0' y='280.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' text-anchor='middle' fill='#111'>5 × 6Х7Б (10 линий)</text>
<text x='390.0' y='297.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' text-anchor='middle' fill='#111'>подтяжка 100k → +5 В</text>
<text x='390.0' y='314.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' text-anchor='middle' fill='#111'>развязка линий</text>
<text x='390.0' y='331.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' text-anchor='middle' fill='#111'>на время записи</text>
<rect x='520.0' y='240.0' width='180' height='120' fill='#fafafa' stroke='#111' stroke-width='1.5'/>
<text x='610.0' y='260.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' text-anchor='middle' fill='#111' font-weight='bold'>BinToBcdN</text>
<text x='610.0' y='280.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' text-anchor='middle' fill='#111'>≈ 7,5 ламп</text>
<text x='610.0' y='297.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' text-anchor='middle' fill='#111'>4 × ИЛИ-НЕ</text>
<text x='610.0' y='314.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' text-anchor='middle' fill='#111'>выход — активный ноль</text>
<text x='610.0' y='331.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' text-anchor='middle' fill='#111'>(TC-O3)</text>
<rect x='520.0' y='400.0' width='180' height='90' fill='none' stroke='#111' stroke-width='1.5' stroke-dasharray='6,4'/>
<text x='610.0' y='420.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' text-anchor='middle' fill='#111' font-weight='bold'>Буфер признаков</text>
<text x='610.0' y='440.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' text-anchor='middle' fill='#111'>½ 6Н16Б на линию,</text>
<text x='610.0' y='457.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' text-anchor='middle' fill='#111'>если понадобится</text>
<text x='370.0' y='560.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='12' text-anchor='middle' fill='#555'>Обвязка: 5 (6Х7Б) + 7,5 (BinToBcdN) = 12,5 из 14 мест; +1 — буфер Zero/Nine</text>
<text x='370.0' y='580.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='12' text-anchor='middle' fill='#555'>Питание: +350 В (анод), +150 / −50 В (вентили), +5 В, Uсм, накал 6,3 В</text>
