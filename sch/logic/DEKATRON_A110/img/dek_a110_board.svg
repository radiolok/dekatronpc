<text x='20.0' y='640.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='12' text-anchor='start' fill='#111'>Узел B под Rк держит открытая лампа записи: кабель до платы счётчика висит на низкоомном узле. Катодная линия, диоды и BinToBcdN — рядом,</text>
<text x='20.0' y='658.0' font-family='DejaVu Sans, Arial, sans-serif' font-size='12' text-anchor='start' fill='#111'>без кабеля (SPICE §9.7–9.8). Ключ подкатода — на плате счётчика: кабель между анодом ключа и Cп (CKA 30 пФ в SPICE). 6Н16Б: каналы + GLIFT.</text>
