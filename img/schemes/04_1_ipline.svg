<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" class="dg" role="img" aria-label="Линия выборки: автомат управляет счётчиком инструкций и счётчиком вложенности циклов, читает опкоды из памяти программ в регистр инструкции и по детектору скобок решает, нужна ли промотка тела цикла."><style>
