yline points="200,118 16,118"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#ipl-a)"/><text x="20" y="111"  fill="#172024" font-size="11" font-family="sans-serif" class="tp" text-anchor="start">ready</text><polyline points="200,244 16,244"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#ipl-a)"/><text x="20" y="237"  fill="#172024" font-size="11" font-family="sans-serif" class="tp" text-anchor="start">insn_in_ready</text><polyline points="200,272 16,272"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#ipl-a)"/><text x="20" y="265"  fill="#172024" font-size="11" font-family="sans-serif" class="tp" text-anchor="start">loop_overflow</text><rect x="200" y="40" width="220" height="250" rx="2"  fill="#ffffff" stroke="#172024" stroke-width="1.2" class="blk"/><text x="210" y="62"  fill="#172024" font-size="14" font-family="sans-serif" class="tt" text-anchor="start">Автомат выборки</text><text x="210" y="79"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="start">ip_counted_q — IP уже</text><text x="210" y="93"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="start">сдвинут под инструкцию</text><text x="210" y="107"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="start"></text><text x="210" y="121"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="start">scanning_q — идёт промотка</text><text x="210" y="135"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="start"></text><text x="210" y="149"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="start">dir_q — шаг IP назад</text><text x="210" y="163"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="start">(промотка, кнопка −IP)</text><text x="210" y="177"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="start"></text><text x="210" y="191"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="start">overflow_q — глубина &gt; 99</text><text x="210" y="205"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="start"></text><text x="210" y="219"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="start">стробы — из state (Мур)</text><polyline points="420,70 560,70"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#ipl-a)"/><text x="428" y="63"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="start">valid · dec</text><polyline points="560,108 420,108"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#ipl-a)"/><text x="428" y="101"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="start">ready</text><rect x="560" y="40" width="210" height="100" rx="2"  fill="#ffffff" stroke="#172024" stroke-width="1.2" class="blk"/><text x="665" y="59"  fill="#172024" font-size="14" font-family="sans-serif" class="tt" text-anchor="middle">DekatronCounter · IP</text><text x="665" y="76"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">5 декад, 0…99999</text><text x="665" y="90"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">HARD_RST_D_CNT = 3</text><text x="665" y="104"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">hard_rst → 99900</text><text x="665" y="118"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">soft_rst → 00000</text><polyline points="420,186 560,186"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#ipl-a)"/><text x="428" y="179"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="start">valid · dec · set_zero</text><polyline points="560,224 420,224"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#ipl-a)"/><text x="428" y="217"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="start">zero</text><rect x="560" y="168" width="210" height="80" rx="2"  fill="#ffffff" stroke="#172024" stroke-width="1.2" class="blk"/><text x="665" y="187"  fill="#172024" font-size="14" font-family="sans-serif" class="tt" text-anchor="middle">DekatronCounter · Loop</text><text x="665" y="204"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">2 декады, 0…99</text><text x="665" y="218"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">LOOP_DEKATRON_NUM = 2</text><text x="665" y="232"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">переход через 0 = переполнение</text><polyline points="770,90 880,90"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#ipl-a)"/><text x="778" y="83"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="start">ip_addr (BCD)</text><rect x="880" y="40" width="250" height="210" rx="2"  fill="#ffffff" stroke="#172024" stroke-width="1.2" class="blk"/><text x="1005" y="59"  fill="#172024" font-size="14" font-family="sans-serif" class="tt" text-anchor="middle">IpMemory</text><text x="1005" y="76"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">Ram 100 000 × 4 бит</text><text x="1005" y="90"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">банки 100×100</text><text x="1005" y="104"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle"></text><text x="1005" y="118"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">старший банк 999xx —</text><text x="1005" y="132"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">ПЗУ загрузчика</text><text x="1005" y="146"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">(наложение ovl_*)</text><text x="1005" y="160"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle"></text><text x="1005" y="174"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">запись туда → err</text><text x="1005" y="188"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">rd_data — регистр</text><polyline points="310,40 310,20 1005,20 1005,40"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#ipl-a)"/><text x="658" y="14"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="middle">mem_valid · mem_wr · wr_data</text><polyline points="1005,250 1005,340 770,340"  fill="none" stroke="#c8431a" stroke-width="1.9" class="wacc" marker-end="url(#ipl-ag)"/><text x="1012" y="300"  fill="#c8431a" font-size="11" font-family="sans-serif" class="tacc" text-anchor="start">rd_data</text><rect x="560" y="310" width="210" height="80" rx="2"  fill="#ffffff" stroke="#172024" stroke-width="1.2" class="blk"/><text x="665" y="329"  fill="#172024" font-size="14" font-family="sans-serif" class="tt" text-anchor="middle">insn_q + InsnLoopDetector</text><text x="665" y="346"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">0x6 — [ или {</text><text x="665" y="360"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">0x7 — ] или }</text><text x="665" y="374"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">один детектор на регистр</text><polyline points="560,340 310,340 310,290"  fill="none" stroke="#c8431a" stroke-width="1.9" class="wacc" marker-end="url(#ipl-ag)"/><text x="316" y="334"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="start">скобка открыта / закрыта</text><polyline points="665,390 665,430 16,430"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#ipl-a)"/><text x="20" y="423"  fill="#172024" font-size="11" font-family="sans-serif" class="tp" text-anchor="start">insn, insn_valid</text><text x="16" y="456"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="start">Опкоды на этом уровне — только 4-битные коды; символы преобразует загрузчик программ.</text></g></svg>
