k_gen_n</text><polyline points="330,50 330,400"  fill="none" stroke="#172024" stroke-width="1.2" class="w"/><circle cx="330" cy="225" r="2.8"  fill="#172024" stroke="none" stroke-width="0" class="dot"/><polyline points="330,50 400,50"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#ct-a)"/><circle cx="330" cy="50" r="2.8"  fill="#172024" stroke="none" stroke-width="0" class="dot"/><rect x="400" y="30" width="90" height="40" rx="2"  fill="#ffffff" stroke="#172024" stroke-width="1.2" class="blk"/><text x="445" y="49"  fill="#172024" font-size="14" font-family="sans-serif" class="tt" text-anchor="middle">NOT_N16</text><text x="445" y="66"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">clkIp</text><polyline points="490,50 640,50"  fill="none" stroke="#c8431a" stroke-width="1.9" class="wacc" marker-end="url(#ct-ag)"/><text x="500" y="42"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="start">clk_ip</text><polyline points="330,110 400,110"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#ct-a)"/><circle cx="330" cy="110" r="2.8"  fill="#172024" stroke="none" stroke-width="0" class="dot"/><rect x="400" y="90" width="90" height="40" rx="2"  fill="#ffffff" stroke="#172024" stroke-width="1.2" class="blk"/><text x="445" y="109"  fill="#172024" font-size="14" font-family="sans-serif" class="tt" text-anchor="middle">NOT_N16</text><text x="445" y="126"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">clkAp</text><polyline points="490,110 640,110"  fill="none" stroke="#c8431a" stroke-width="1.9" class="wacc" marker-end="url(#ct-ag)"/><text x="500" y="102"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="start">clk_ap</text><polyline points="330,170 400,170"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#ct-a)"/><circle cx="330" cy="170" r="2.8"  fill="#17202