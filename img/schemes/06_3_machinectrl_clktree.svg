sans-serif" class="tm" text-anchor="middle">clkLoc[0]</text><polyline points="490,300 640,300"  fill="none" stroke="#c8431a" stroke-width="1.9" class="wacc" marker-end="url(#ct-ag)"/><text x="500" y="292"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="start">clk_loc[0]</text><polyline points="330,350 400,350"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#ct-a)"/><circle cx="330" cy="350" r="2.8"  fill="#172024" stroke="none" stroke-width="0" class="dot"/><rect x="400" y="330" width="90" height="40" rx="2"  fill="#ffffff" stroke="#172024" stroke-width="1.2" class="blk"/><text x="445" y="349"  fill="#172024" font-size="14" font-family="sans-serif" class="tt" text-anchor="middle">NOT_N16</text><text x="445" y="366"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">clkLoc[1]</text><polyline points="490,350 640,350"  fill="none" stroke="#c8431a" stroke-width="1.9" class="wacc" marker-end="url(#ct-ag)"/><text x="500" y="342"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="start">clk_loc[1]</text><polyline points="330,400 400,400"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#ct-a)"/><circle cx="330" cy="400" r="2.8"  fill="#172024" stroke="none" stroke-width="0" class="dot"/><rect x="400" y="380" width="90" height="40" rx="2"  fill="#ffffff" stroke="#172024" stroke-width="1.2" class="blk"/><text x="445" y="399"  fill="#172024" font-size="14" font-family="sans-serif" class="tt" text-anchor="middle">NOT_N16</text><text x="445" y="416"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">clkLoc[2]</text><polyline points="490,400 640,400"  fill="none" stroke="#c8431a" stroke-width="1.9" class="wacc" marker-end="url(#ct-ag)"/><text x="500" y="392"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="start">clk_loc[2]</text><rect x="640" y="24" width="540" height="62" rx="2"  fill="#ffffff" stroke="#172024" stroke-width="1.2" class="blk-opt"/><text x="910" y="42"  fill="#172024" font-size="14" font-family="sans-serif" class="tt" text-anchor="middle">IpLine</text><text x="910" y="59"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">5 DFFP на C напрямую; 3 NOT_N16 по 2 DFF_J2N16 (9 сеток)</text><text x="910" y="73"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">(state_hi×2 | scanning, halt_pending | overflow, dir)</text><rect x="640" y="94" width="540" height="56" rx="2"  fill="#ffffff" stroke="#172024" stroke-width="1.2" class="blk-opt"/><text x="910" y="112"  fill="#172024" font-size="14" font-family="sans-serif" class="tt" text-anchor="middle">ApLine</text><text x="910" y="129"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">6 DFFP на C напрямую (state, mem_here, счётчик данных);</text><text x="910" y="143"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">свой NOT_N16 → DFF_J2N16 lock_q</text><rect x="640" y="160" width="540" height="100" rx="2"  fill="#ffffff" stroke="#172024" stroke-width="1.2" class="blk-opt"/><text x="910" y="178"  fill="#172024" font-size="14" font-family="sans-serif" class="tt" text-anchor="middle">Ферритовые памяти</text><text x="910" y="195"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">clk_ipm → IpMemory (программы)</text><text x="910" y="209"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">clk_apm → Ram (данные)</text><text x="910" y="223"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">память стартует от фронта своей цепи, а не от порта Clk</text><rect x="640" y="276" width="540" height="140" rx="2"  fill="#ffffff" stroke="#172024" stroke-width="1.2" class="blk-opt"/><text x="910" y="294"  fill="#172024" font-size="14" font-family="sans-serif" class="tt" text-anchor="middle">MachineCtrl (19 DFFP, 7 / 6 / 6)</text><text x="910" y="311"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">clk_loc[0]: 6 синхронизаторов пульта и rst_busy, latchRstRq</text><text x="910" y="325"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">clk_loc[1]: opFF[3:0], pfFF, insnLoadFF</text><text x="910" y="339"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">clk_loc[2]: stateFF[3:0], oneStepFF, rstSoftFF</text><text x="910" y="353"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">DFF_J2N16 в блоке нет: второго инвертора не нужно</text><text x="12" y="450"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="start">полярность: генератор выдаёт обратный клок, выход инвертора — прямой Clk машины; рабочий фронт DFFP — нарастающий, DFF_J2N16 берёт его по спаду своего инвертора</text></g></svg>
