d="url(#tube-a)"/><text x="445" y="188"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="middle">класс положения: катод / A / B</text><polyline points="190,238 190,156"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#tube-a)"/><text x="196" y="222"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="start">перемещения нет</text><polyline points="320,298 740,298 740,156"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#tube-a)"/><text x="470" y="290"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="middle">загрузка цели в кольцо</text><polyline points="800,100 850,100"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#tube-a)"/><rect x="850" y="44" width="160" height="112" rx="2"  fill="#ffffff" stroke="#172024" stroke-width="1.2" class="blk"/><text x="930" y="63"  fill="#172024" font-size="14" font-family="sans-serif" class="tt" text-anchor="middle">Дешифратор</text><text x="930" y="80"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">main = cathodes[3d]</text><text x="930" y="94"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">выход только если</text><text x="930" y="108"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">разряд на катоде и</text><text x="930" y="122"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">воздействий нет</text><polyline points="1010,100 1022,100"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#tube-a)"/><text x="1028" y="104"  fill="#172024" font-size="11" font-family="sans-serif" class="tp" text-anchor="start"></text><text x="1016" y="92"  fill="#172024" font-size="11" font-family="sans-serif" class="tp" text-anchor="start">main_onehot_o</text><polyline points="800,135 825,135 825,286 850,286"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#tube-a)"/><rect x="850" y="238" width="200" height="118" rx="2"  fill="#ffffff" stroke="#172024" stroke-width="1.2" class="blk-opt"/><text x="950" y="257"  fill="#172024" font-size="14" font-family="sans-serif" class="tt" text-anchor="middle">Отладка</text><text x="950" y="274"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">cathodes_dbg_o[29:0]</text><text x="950" y="288"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">on_guide · moving</text><text x="950" y="302"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">in_write_reset · settled</text><text x="950" y="316"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">invalid</text><text x="140" y="380"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="start">Все регистры тактируются hsClk; цифровых сбросов у модели нет — только катодные импульсы reset0_i и resetN_i.</text></g></svg>
