<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" width="1100" height="440" class="dg" role="img" aria-label="Автомат IpLine. Основной цикл: шаг IP, чтение опкода. Ветвь промотки: разбор скобки, шаг счётчика вложенности, снова шаг IP до парной скобки. Каждое состояние, выдающее операцию, ждёт go — готовности обоих счётчиков и памяти — и уходит в такте её приёма."><style>
.dg { color: #172024; display: block; height: auto; color: #172024; }
