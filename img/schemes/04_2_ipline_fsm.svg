h="96" height="34" rx="17"  fill="#ffffff" stroke="#172024" stroke-width="1.3" class="st"/><text x="400" y="214"  fill="#172024" font-size="11" font-family="sans-serif" class="ts" text-anchor="middle">S_IP_OP</text><rect x="652" y="193" width="96" height="34" rx="17"  fill="#ffffff" stroke="#172024" stroke-width="1.3" class="st"/><text x="700" y="214"  fill="#172024" font-size="11" font-family="sans-serif" class="ts" text-anchor="middle">S_IP_WAIT</text><rect x="912" y="193" width="96" height="34" rx="17"  fill="#ffffff" stroke="#172024" stroke-width="1.3" class="st"/><text x="960" y="214"  fill="#172024" font-size="11" font-family="sans-serif" class="ts" text-anchor="middle">S_LOOP_OP</text><rect x="62" y="343" width="96" height="34" rx="17"  fill="#ffffff" stroke="#172024" stroke-width="1.3" class="st"/><text x="110" y="364"  fill="#172024" font-size="11" font-family="sans-serif" class="ts" text-anchor="middle">S_WRITE</text><rect x="906.3" y="343" width="107.4" height="34" rx="17"  fill="#ffffff" stroke="#172024" stroke-width="1.3" class="st"/><text x="960" y="364"  fill="#172024" font-size="11" font-family="sans-serif" class="ts" text-anchor="middle">S_LOOP_WAIT</text><polyline points="158,52 352,52"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#iplfsm-a)"/><text x="255" y="45"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="middle">halt_rq снят</text><polyline points="352,68 158,68"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#iplfsm-a)"/><text x="255" y="86"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="middle">halt_rq, IP не сдвинут</text><polyline points="130,77 130,160 280,160 280,200 352,200"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#iplfsm-a)"/><text x="205" y="176"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="middle">кнопка ±IP</text><polyline points="365,77 365,120 80,120 80,193"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#iplfsm-a)"/><text x="220" y="114"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="middle">загрузка с текущего адреса</text><polyline points="385,77 385,193"  fill="none" stroke="#a4126e" stroke-width="1.8" stroke-dasharray="5 3" class="wwarn" marker-end="url(#iplfsm-aw)"/><text x="378" y="178"  fill="#a4126e" font-size="11" font-family="sans-serif" class="twarn" text-anchor="end">останов: IP+1</text><polyline points="410,77 410,193"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#iplfsm-a)"/><text x="418" y="170"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="start">шаг IP</text><polyline points="435,77 435,110 1040,110 1040,210 1008,210"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#iplfsm-a)"/><text x="560" y="104"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="middle">текущая скобка требует промотки</text><polyline points="448,52 652,52"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#iplfsm-a)"/><text x="550" y="45"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="middle">IP не сдвинут: чтение на месте</text><polyline points="652,68 448,68"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#iplfsm-a)"/><text x="550" y="86"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="middle">опкод выдан</text><polyline points="448,210 652,210"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#iplfsm-a)"/><text x="550" y="203"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="middle">ip_ready</text><polyline points="700,193 700,77"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#iplfsm-a)"/><text x="708" y="172"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="start">чтение</text><polyline points="748,60 906.3,60"  fill="none" stroke="#c8431a" stroke-width="1.9" class="wacc" marker-end="url(#iplfsm-ag)"/><text x="830" y="52"  fill="#c8431a" font-size="11" font-family="sans-serif" class="tacc" text-anchor="middle">scanning_q</text><polyline points="980,77 980,193"  fill="none" stroke="#c8431a" stroke-width="1.9" class="wacc" marker-end="url(#iplfsm-ag)"/><text x="988" y="150"  fill="#c8431a" font-size="11" font-family="sans-serif" class="tacc" text-anchor="start">скобка</text><polyline points="930,77 930,140 430,140 430,193"  fill="none" stroke="#c8431a" stroke-width="1.9" class="wacc" marker-end="url(#iplfsm-ag)"/><text x="600" y="156"  fill="#c8431a" font-size="11" font-family="sans-serif" class="tacc" text-anchor="middle">не скобка</text><polyline points="960,227 960,343"  fill="none" stroke="#c8431a" stroke-width="1.9" class="wacc" marker-end="url(#iplfsm-ag)"/><text x="968" y="290"  fill="#c8431a" font-size="11" font-family="sans-serif" class="tacc" text-anchor="start">loop_ready</text><polyline points="906.3,360 840,360 840,330 400,330 400,227"  fill="none" stroke="#c8431a" stroke-width="1.9" class="wacc" marker-end="url(#iplfsm-ag)"/><text x="620" y="324"  fill="#c8431a" font-size="11" font-family="sans-serif" class="tacc" text-anchor="middle">пара не найдена: дальше</text><polyline points="1013.7,360 1070,360 1070,20 400,20 400,43"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#iplfsm-a)"/><text x="735" y="14"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="middle">пара найдена или переполнение 99→0</text><polyline points="680,227 680,265 135,265 135,227"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#iplfsm-a)"/><text x="290" y="259"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="middle">загрузка</text><polyline points="720,227 720,300 40,300 40,60 62,60"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#iplfsm-a)"/><text x="420" y="294"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="middle">halt_pending: останов отработан</text><polyline points="158,220 352,220"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#iplfsm-a)"/><text x="230" y="236"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="middle">ручной ±IP</text><polyline points="90,227 90,343"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#iplfsm-a)"/><text x="98" y="330"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="end">опкод принят</text><polyline points="158,360 196,360"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#iplfsm-a)"/><text x="202" y="364"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="start">→ S_IDLE: записан</text><text x="16" y="414"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="start">S_INSN_IN → S_IDLE: конец передачи (EOT) или загрузка снята</text><rect x="470" y="372" width="340" height="52" rx="2"  fill="#ffffff" stroke="#172024" stroke-width="1.2" class="blk-opt"/><text x="484" y="393"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="start">CLRI, CLRL: IDLE → S_CLR_OP → S_CLR_WAIT → IDLE</text><text x="484" y="409"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="start">сброс IP или счётчика вложенности</text><text x="16" y="432"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="start">soft_rst | hard_rst → S_IDLE из любого состояния</text></g></svg>
