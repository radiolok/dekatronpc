</style><rect x="0" y="0" width="1100" height="440" fill="#fbfcfb"/><defs><marker id="iplfsm-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z"  fill="#172024" stroke="none" stroke-width="0" class="ah"/></marker><marker id="iplfsm-ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z"  fill="#c8431a" stroke="none" stroke-width="0" class="ahg"/></marker><marker id="iplfsm-aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z"  fill="#a4126e" stroke="none" stroke-width="0" class="ahw"/></marker></defs><g transform="translate(0,0)"><rect x="62" y="43" width="96" height="34" rx="17"  fill="#ffffff" stroke="#172024" stroke-width="1.3" class="st"/><text x="110" y="64"  fill="#172024" font-size="11" font-family="sans-serif" class="ts" text-anchor="middle">S_HALT</text><rect x="352" y="43" width="96" height="34" rx="17"  fill="#f5ddd3" stroke="#c8431a" stroke-width="1.9" class="st-acc"/><text x="400" y="64"  fill="#172024" font-size="11" font-family="sans-serif" class="ts" text-anchor="middle">S_IDLE</text><rect x="652" y="43" width="96" height="34" rx="17"  fill="#ffffff" stroke="#172024" stroke-width="1.3" class="st"/><text x="700" y="64"  fill="#172024" font-size="11" font-family="sans-serif" class="ts" text-anchor="middle">S_FETCH</text><rect x="62" y="193" width="96" height="34" rx="17"  fill="#ffffff" stroke="#172024" stroke-width="1.3" class="st"/><text x="110" y="214"  fill="#172024" font-size="11" font-family="sans-serif" class="ts" text-anchor="middle">S_INSN_IN</text><rect x="352" y="193" width="96" height="34" rx="17"  fill="#ffffff" stroke="#172024" stroke-width="1.3" class="st"/><text x="400" y="214"  fill="#172024" font-size="11" font-family="sans-serif" class="ts" text-anchor="middle">S_IP</text><rect x="652" y="193" width="96" height="34" rx="17"  fill="#ffffff" stroke="#172024" stroke-width="1.3" class="st"/><text x="700" y="214"  fill="#172024" font-size="11" font-family="sans-serif" class="ts" text-anchor="middle">S_LOOP</text><rect x="906.3" y="193" width="107.4" height="34" rx="17"  fill="#ffffff" stroke="#172024" stroke-width="1.3" class="st"/><text x="960" y="214"  fill="#172024" font-size="11" font-family="sans-serif" class="ts" text-anchor="middle">S_SCAN_EVAL</text><polyline points="158,52 352,52"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#iplfsm-a)"/><text x="255" y="45"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="middle">halt_rq снят</text><polyline points="352,68 158,68"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#iplfsm-a)"/><text x="255" y="86"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="middle">halt_rq, IP не сдвинут</text><polyline points="130,77 130,160 280,160 280,198 352,198"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#iplfsm-a)"/><text x="205" y="176"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="middle">кнопка ±IP</text><polyline points="365,77 365,120 80,120 80,193"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#iplfsm-a)"/><text x="220" y="114"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="middle">загрузка с текущего адреса</text><polyline points="385,77 385,193"  fill="none" stroke="#a4126e" stroke-width="1.8" stroke-dasharray="5 3" class="wwarn" marker-end="url(#iplfsm-aw)"/><text x="378" y="178"  fill="#a4126e" font-size="11" font-family="sans-serif" class="twarn" text-anchor="end">останов: IP+1</text><polyline points="410,77 410,193"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#iplfsm-a)"/><text x="418" y="170"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="start">шаг IP</text><polyline points="435,77 435,120 700,120 700,193"  fill="none" stroke="#c8431a" stroke-width="1.9" class="wacc" marker-end="url(#iplfsm-ag)"/><text x="455" y="114"  fill="#c8431a" font-size="11" font-family="sans-serif" class="tacc" text-anchor="start">скобка: промотка</text><polyline points="448,52 652,52"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#iplfsm-a)"/><text x="550" y="45"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="middle">IP не сдвинут: чтение на месте</text><polyline points="448,200 600,200 600,68 652,68"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#iplfsm-a)"/><text x="606" y="170"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="start">go: шаг выдан</text><polyline points="700,43 700,20 420,20 420,43"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#iplfsm-a)"/><text x="560" y="14"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="middle">go: чтение выдано; конца чтения ждёт ready</text><polyline points="748,60 960,60 960,193"  fill="none" stroke="#c8431a" stroke-width="1.9" class="wacc" marker-end="url(#iplfsm-ag)"/><text x="968" y="140"  fill="#c8431a" font-size="11" font-family="sans-serif" class="tacc" text-anchor="start">go · scanning_q</text><polyline points="906.3,210 748,210"  fill="none" stroke="#c8431a" stroke-width="1.9" class="wacc" marker-end="url(#iplfsm-ag)"/><text x="830" y="203"  fill="#c8431a" font-size="11" font-family="sans-serif" class="tacc" text-anchor="middle">скобка</text><polyline points="940,227 940,290 390,290 390,227"  fill="none" stroke="#c8431a" stroke-width="1.9" class="wacc" marker-end="url(#iplfsm-ag)"/><text x="680" y="284"  fill="#c8431a" font-size="11" font-family="sans-serif" class="tacc" text-anchor="middle">не скобка</text><polyline points="700,227 700,260 420,260 420,227"  fill="none" stroke="#c8431a" stroke-width="1.9" class="wacc" marker-end="url(#iplfsm-ag)"/><text x="545" y="254"  fill="#c8431a" font-size="11" font-family="sans-serif" class="tacc" text-anchor="middle">go: шаг выдан</text><text x="430" y="318"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="start">→ S_IDLE из S_IP: scanning_q и нуль счётчика вложенности — пара найдена</text><text x="430" y="334"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="start">→ S_IDLE из S_SCAN_EVAL: своя скобка при 99 — переполнение, промотка прервана</text><text x="430" y="350"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="start">S_SCAN_EVAL разбирает опкод по go, когда чтение окончено</text><polyline points="352,210 158,210"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#iplfsm-a)"/><text x="200" y="205"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="middle">загрузка</text><polyline points="158,222 352,222"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#iplfsm-a)"/><text x="255" y="238"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="middle">ручной ±IP</text><polyline points="370,227 370,340 40,340 40,60 62,60"  fill="none" stroke="#a4126e" stroke-width="1.8" stroke-dasharray="5 3" class="wwarn" marker-end="url(#iplfsm-aw)"/><text x="210" y="334"  fill="#a4126e" font-size="11" font-family="sans-serif" class="twarn" text-anchor="middle">halt_pending</text><text x="16" y="366"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="start">S_INSN_IN → S_IDLE: опкод принят, запись в память</text><text x="16" y="382"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="start">выдана в такте рукопожатия; EOT не пишется → insn_eot</text><text x="16" y="400"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="start">S_INSN_IN → S_IDLE: загрузка снята</text><rect x="560" y="372" width="420" height="52" rx="2"  fill="#ffffff" stroke="#172024" stroke-width="1.2" class="blk-opt"/><text x="574" y="393"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="start">CLRI, CLRL: IDLE → S_CLR_IP | S_CLR_LOOP → IDLE</text><text x="574" y="409"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="start">set_zero выдаётся по go, сброс окончен — ready в S_IDLE</text><text x="16" y="432"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="start">soft_rst | hard_rst → S_IDLE из любого состояния</text></g></svg>
