<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" class="dg" role="img" aria-label="Верхний уровень: пульт и терминал, автомат управления, линия выборки со своей памятью программ, линия данных со своей памятью данных, реле времени, которое держит физические линии сброса всех счётчиков; второй порт памяти — только для эмулятора."><style>
