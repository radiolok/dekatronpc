<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" width="760" height="390" class="dg" role="img" aria-label="Автомат счётчика: шаг выполняется в состоянии IDLE без снятия ready, операции записи уходят в SET, ZERO или TOP на время окна записи, линии сброса — в RST до снятия линии и конца окна."><style>
