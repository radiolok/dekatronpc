polyline points="178,135 422,55"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#cntfsm-a)"/><text x="300" y="88"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="middle">set</text><polyline points="178,145 422,145"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#cntfsm-a)"/><text x="300" y="139"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="middle">set_zero или TOP+1→0</text><polyline points="178,155 422,235"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#cntfsm-a)"/><text x="300" y="240"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="middle">0−1 → TOP_VALUE</text><polyline points="518,55 640,55"  fill="none" stroke="#172024" stroke-width="1.2" class="w"/><polyline points="518,145 640,145"  fill="none" stroke="#172024" stroke-width="1.2" class="w"/><polyline points="518,235 640,235"  fill="none" stroke="#172024" stroke-width="1.2" class="w"/><polyline points="640,55 640,275 130,275 130,162"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#cntfsm-a)"/><text x="646" y="160"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="start">writing</text><text x="646" y="174"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="start">снят</text><text x="380" y="270"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="middle">окно записи закончилось</text><rect x="282" y="298" width="96" height="34" rx="17"  fill="#ffffff" stroke="#172024" stroke-width="1.3" class="st"/><text x="330" y="319"  fill="#172024" font-size="11" font-family="sans-serif" class="ts" text-anchor="middle">ST_RST</text><polyline points="282,315 100,315 100,162"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#cntfsm-a)"/><text x="176" y="309"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="middle">линия снята · окно истекло</text><path d="M314,332 C306,373.6 354,373.6 346,332"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#cntfsm-a)"/><text x="330" y="382"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="middle">rst_active | writing</text><text x="16" y="24"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="start">soft_rst | hard_rst → ST_RST из любого состояния, запуск окна записи; rst_n → ST_RST</text></g></svg>
