<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 420" width="1060" height="420" class="dg" role="img" aria-label="Декатронный модуль: ключи подкатодов на двух лампах J2, необязательная схема записи, декатрон, необязательная схема чтения и отводы позиций для схемы переноса."><style>
