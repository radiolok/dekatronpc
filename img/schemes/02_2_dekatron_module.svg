-size="10" font-family="sans-serif" class="tpi" text-anchor="start">resetN_i</text><text x="604" y="196"  fill="#56636a" font-size="10" font-family="sans-serif" class="tpi" text-anchor="end">main_onehot_o</text><polyline points="610,210 690,210"  fill="none" stroke="#172024" stroke-width="1.2" class="w"/><circle cx="690" cy="210" r="2.8"  fill="#172024" stroke="none" stroke-width="0" class="dot"/><polyline points="690,82 690,330"  fill="none" stroke="#172024" stroke-width="3.2" class="wbus"/><text x="698" y="360"  fill="#56636a" font-size="10.5" font-family="sans-serif" class="tn" text-anchor="start">позиционный код [9:0]</text><polyline points="690,82 740,82"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#module-a)"/><rect x="740" y="52" width="170" height="60" rx="2"  fill="#ffffff" stroke="#172024" stroke-width="1.2" class="blk-opt"/><text x="825" y="71"  fill="#172024" font-size="14" font-family="sans-serif" class="tt" text-anchor="middle">BinToBcd</text><text x="825" y="88"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">ИЛИ по линиям 8-4-2-1</text><text x="825" y="126"  fill="#56636a" font-size="10.5" font-family="sans-serif" class="tn" text-anchor="middle">только при READ</text><polyline points="910,82 940,82"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#module-a)"/><text x="946" y="86"  fill="#172024" font-size="11" font-family="sans-serif" class="tp" text-anchor="start">Out[3:0]</text><polyline points="690,240 940,240"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#module-a)"/><circle cx="690" cy="240" r="2.8"  fill="#172024" stroke="none" stroke-width="0" class="dot"/><text x="698" y="235"  fill="#56636a" font-size="10.5" font-family="sans-serif" class="tn" text-anchor="start">[0]</text><text x="946" y="244"  fill="#172024" font-size="11" font-family="sans-serif" class="tp" text-anchor="start">Zero</text><polyline points="690,272 940,272"  fill="none" stroke="#172024" stroke-width="1.2" class="w" marker-end="url(#module-a)"/><circle cx="690" cy="272" r="2.8"  fill="#172024" stroke="none" stroke-width="0" class="dot"/><text x="698" y="267"  fill="#56636a" font-size="10.5" font-family="sans-serif" class="tn" text-anchor="start">[9]</text><text x="946" y="276"  fill="#172024" font-size="11" font-family="sans-serif" class="tp" text-anchor="start">Nine</text><polyline points="690,304 940,304"  fill="none" stroke="#172024" stroke-width="1.2" stroke-dasharray="5 3" class="wd" marker-end="url(#module-a)"/><circle cx="690" cy="304" r="2.8"  fill="#172024" stroke="none" stroke-width="0" class="dot"/><text x="698" y="299"  fill="#56636a" font-size="10.5" font-family="sans-serif" class="tn" text-anchor="start">[TOP_PIN_OUT]</text><text x="946" y="308"  fill="#172024" font-size="11" font-family="sans-serif" class="tp" text-anchor="start">TopPin</text><text x="698" y="324"  fill="#56636a" font-size="10.5" font-family="sans-serif" class="tn" text-anchor="start">TopPin только при TOP_LIMIT_MODE</text></g></svg>
