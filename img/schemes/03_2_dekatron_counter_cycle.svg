.dg .seg-off { fill: #e3e9e8; stroke: #56636a; stroke-width: 1; }
</style><rect x="0" y="0" width="760" height="250" fill="#fbfcfb"/><defs><marker id="cntcyc-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z"  fill="#172024" stroke="none" stroke-width="0" class="ah"/></marker><marker id="cntcyc-ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z"  fill="#c8431a" stroke="none" stroke-width="0" class="ahg"/></marker><marker id="cntcyc-aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z"  fill="#a4126e" stroke="none" stroke-width="0" class="ahw"/></marker></defs><g transform="translate(0,0)"><text x="16" y="24"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="start">Clk = 100 кГц, hsClk = 10 × Clk (1 мкс), любая операция — один такт, ready = 1</text><rect x="20" y="50" width="220" height="150" rx="2"  fill="#ffffff" stroke="#172024" stroke-width="1.2" class="blk"/><text x="130" y="74"  fill="#172024" font-size="14" font-family="sans-serif" class="tt" text-anchor="middle">Шаг ±1</text><text x="130" y="91"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">step_f/step_r = accept · ¬set_any</text><text x="130" y="105"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">фазы: [D, D+P1), [D+P1, D+P1+P2)</text><text x="130" y="119"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">затем сваливание</text><text x="130" y="133"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">показание — на фронте</text><rect x="270" y="50" width="220" height="150" rx="2"  fill="#ffffff" stroke="#172024" stroke-width="1.2" class="blk"/><text x="380" y="74"  fill="#172024" font-size="14" font-family="sans-serif" class="tt" text-anchor="middle">Запись</text><text x="380" y="91"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">set, set_zero, 0−1→TOP, TOP+1→0</text><text x="380" y="105"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">линия = accept, весь такт</text><text x="380" y="119"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">WRITE_MIN_HS + PHASE_DELAY_HS</text><text x="380" y="133"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">&lt; HS_PER_CLK</text><rect x="520" y="50" width="220" height="150" rx="2"  fill="#ffffff" stroke="#172024" stroke-width="1.2" class="blk"/><text x="630" y="74"  fill="#172024" font-size="14" font-family="sans-serif" class="tt" text-anchor="middle">Признаки на фронте</text><text x="630" y="91"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">nines_q, zeroes_q — перенос</text><text x="630" y="105"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">zero_q, at_top_q — край</text><text x="630" y="119"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">катоды читаются всегда,</text><text x="630" y="133"  fill="#172024" font-size="11" font-family="sans-serif" class="tm" text-anchor="middle">верны на фронте</text><text x="16" y="228"  fill="#56636a" font-size="11" font-family="sans-serif" class="tl" text-anchor="start">soft_rst | hard_rst: ready снят, пока поднята линия; длительность держит внешнее реле</text></g></svg>
