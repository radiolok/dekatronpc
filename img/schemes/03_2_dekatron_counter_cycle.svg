.dg .tn { fill: #56636a; font-size: 10.5px; }
.dg .tg { font-family: "JetBrains Mono", "DejaVu Sans Mono", Consolas, "Liberation Mono", monospace; font-size: 13px; font-weight: 700; }
.dg .ts { font-family: "JetBrains Mono", "DejaVu Sans Mono", Consolas, "Liberation Mono", monospace; font-size: 11.5px; font-weight: 600; }
