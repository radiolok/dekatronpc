<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" class="dg" role="img" aria-label="Такт операции счётчика: шаг и запись подаются уровнем весь такт accept и завершены к следующему фронту clk; там же защёлкиваются признаки до следующей операции."><style>
.dg { color: #172024; display: block; height: auto; color: #172024; }
.dg text { fill: currentColor; font-family: "PT Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; }
