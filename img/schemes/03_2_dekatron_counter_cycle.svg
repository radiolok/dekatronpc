.dg .tk { font-family: "PT Sans Narrow", "Arial Narrow", "Roboto Condensed", Arial, sans-serif; font-weight: 700; font-size: 14px; }
.dg .ti { font-family: "JetBrains Mono", "DejaVu Sans Mono", Consolas, "Liberation Mono", monospace; font-size: 8.5px; fill: #56636a; }
.dg .tnum { font-family: "JetBrains Mono", "DejaVu Sans Mono", Consolas, "Liberation Mono", monospace; font-size: 11px; font-weight: 700; fill: #c8431a; }
.dg .tacc { fill: #c8431a; font-weight: 700; font-size: 11.5px; }
.dg .blk { fill: #ffffff; stroke: currentColor; stroke-width: 1.2; }
.dg .blk-opt { fill: #ffffff; stroke: currentColor; stroke-width: 1.2; stroke-dasharray: 6 3; }
.dg .blk-acc { fill: rgba(200, 67, 26, 0.13); stroke: #c8431a; stroke-width: 1.6; }
.dg .frame { fill: none; stroke: #56636a; stroke-width: 1; stroke-dasharray: 2 4; }
.dg .w { fill: none; stroke: currentColor; stroke-width: 1.2; }
.dg .wd { fill: none; stroke: currentColor; stroke-width: 1.2; stroke-dasharray: 5 3; }
.dg .wacc { fill: none; stroke: #c8431a; stroke-width: 1.9; }
.dg .wbus { fill: none; stroke: currentColor; stroke-width: 3.2; }
.dg .wthin { fill: none; stroke: #56636a; stroke-width: 1; }
.dg .wv { fill: none; stroke: currentColor; stroke-width: 1.6; }
.dg .wvacc { fill: none; stroke: #c8431a; stroke-width: 2.1; }
.dg .grid { stroke: #c6cfcd; stroke-width: 1; }
.dg .ah { fill: currentColor; }
.dg .ahg { fill: #c8431a; }
.dg .ahw { fill: #a4126e; }
.dg .wwarn { fill: none; stroke: #a4126e; stroke-width: 1.8; stroke-dasharray: 6 3; }
.dg .twarn { fill: #a4126e; font-weight: 700; font-size: 11.5px; }
.dg .tl, .dg .tn, .dg .tacc, .dg .twarn { paint-order: stroke; stroke: #fbfcfb; stroke-width: 4px; stroke-linejoin: round; }
.dg .dot { fill: currentColor; }
.dg .dot-acc { fill: #c8431a; }
.dg .inv { fill: #ffffff; stroke: currentColor; stroke-width: 1.2; }
.dg .st { fill: #ffffff; stroke: currentColor; stroke-width: 1.3; }
.dg .st-acc { fill: rgba(200, 67, 26, 0.13); stroke: #c8431a; stroke-width: 1.9; }
.dg .st-dim { fill: #e3e9e8; stroke: #56636a; stroke-width: 1.1; stroke-dasharray: 4 3; }
.dg .anode { fill: #e3e9e8; stroke: #56636a; stroke-width: 1; }
.dg .kmain { fill: #ffffff; stroke: currentColor; stroke-width: 1.4; }
