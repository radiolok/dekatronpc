<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" class="dg" role="img" aria-label="Автомат ApLine: память читается только тогда, когда значение ячейки нужно и его нет ни в счётчике, ни в выходном регистре памяти; выгрузка — только изменённого значения перед сменой адреса."><style>
