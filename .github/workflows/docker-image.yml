name: DekatronPC CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    - name: Build Docker image
      run: docker build . --file Dockerfile --tag dekatron-pc-ci:latest
    - name: Save Docker image
      run: docker save dekatron-pc-ci:latest -o /tmp/image.tar
    - uses: actions/upload-artifact@v5
      with:
        name: docker-image
        path: /tmp/image.tar
        retention-days: 1

  uvm:
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    - uses: actions/download-artifact@v5
      with:
        name: docker-image
        path: /tmp
    - name: Load Docker image
      run: docker load -i /tmp/image.tar
    - name: Run UVM regression
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/var/rtl/run \
          dekatron-pc-ci:latest \
          bash -c "source /var/venv/bin/activate && cd /var/rtl/run/tb && make regression"

  sim:
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    - uses: actions/download-artifact@v5
      with:
        name: docker-image
        path: /tmp
    - name: Load Docker image
      run: docker load -i /tmp/image.tar
    - name: Run RTL simulation
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/var/rtl/run \
          dekatron-pc-ci:latest \
          bash -c "cd /var/rtl/run/rtl/run && ./run_tests.sh -t"

  synt:
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    - uses: actions/download-artifact@v5
      with:
        name: docker-image
        path: /tmp
    - name: Load Docker image
      run: docker load -i /tmp/image.tar
    - name: Run synthesis
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/var/rtl/run \
          dekatron-pc-ci:latest \
          bash -c "source /var/venv/bin/activate && cd /var/rtl/run/rtl/run && ./run_tests.sh -s"

  # Gate-level simulation: the Icarus tests of run_tests.sh -t on the Yosys
  # netlists (rtl/run/synth_sim.sh). A failing run fails the pipeline.
  synth_sim:
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    - uses: actions/download-artifact@v5
      with:
        name: docker-image
        path: /tmp
    - name: Load Docker image
      run: docker load -i /tmp/image.tar
    - name: Run netlist simulation
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/var/rtl/run \
          dekatron-pc-ci:latest \
          bash -c "source /var/venv/bin/activate && cd /var/rtl/run/rtl/run && ./synth_sim.sh"
    - uses: actions/upload-artifact@v5
      if: always()
      with:
        name: synth-sim-logs
        path: |
          rtl/run/synth_sim/**/*.log
          rtl/run/synth_sim/**/*_synth.v
        retention-days: 7
