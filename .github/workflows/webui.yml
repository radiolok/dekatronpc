name: WebUI tests

on:
  push:
    branches: [ "master" ]
    paths:
      - "webui/**"
      - "rtl/run/vtube_cells.lib"
      - ".github/workflows/webui.yml"
  pull_request:
    branches: [ "master" ]
    paths:
      - "webui/**"
      - "rtl/run/vtube_cells.lib"
      - ".github/workflows/webui.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webui
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: webui/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: Run tests
      run: npm test
